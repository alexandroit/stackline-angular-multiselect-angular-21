<section class="skin-section">
  <div class="section-heading">
    <p class="eyebrow">Forms</p>
    <h2>Reactive forms</h2>
    <p class="example-copy">Reactive-form style selected value handling.</p>
    <a class="stackblitz-row-link" [href]="stackBlitzUrl" target="_blank" rel="noopener">Open this route in StackBlitz</a>
  </div>

  <article class="example-row" [class.overflow-example-row]="false">
    <div class="demo-cell">
        <div class="dropdown-stack">
          <angular-multiselect
            [data]="skills"
            [(ngModel)]="reactiveFormsSelected"
            [settings]="reactiveFormsSettings"
            (onSelect)="record('select', $event)"
            (onDeSelect)="record('deselect', $event)"
            (onSelectAll)="record('selectAll', $event)"
            (onDeSelectAll)="record('deselectAll', $event)"
          ></angular-multiselect>
          <p class="settings-preview">skin: {{ reactiveFormsSettings.skin }}</p>
        </div>
    </div>

    <div class="code-cell">
      <div class="code-grid">
        <div class="code-card">
          <strong>HTML</strong>
          <pre>{{ htmlSnippet }}</pre>
        </div>
        <div class="code-card">
          <strong>TS</strong>
          <pre>{{ tsSnippet }}</pre>
        </div>
        <div class="code-card">
          <strong>Data</strong>
          <pre>{{ dataSnippet }}</pre>
        </div>
        <div class="code-card">
          <strong>SCSS</strong>
          <pre>{{ scssSnippet }}</pre>
        </div>
      </div>
    </div>
  </article>
</section>

<section class="activity">
  <h2>Event log</h2>
  <p *ngFor="let event of events">{{ event }}</p>
</section>
