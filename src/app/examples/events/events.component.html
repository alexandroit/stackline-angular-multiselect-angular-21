<section class="skin-section">
  <div class="section-heading">
    <p class="eyebrow">Events</p>
    <h2>Events</h2>
    <p class="example-copy">onSelect/onDeSelect/onSelectAll/onDeSelectAll event logging.</p>
    <a class="stackblitz-row-link" [href]="stackBlitzUrl" target="_blank" rel="noopener">Open this route in StackBlitz</a>
  </div>

  <article class="example-row">
    <div class="demo-cell">
        <div class="dropdown-stack">
          <angular-multiselect
            [data]="countries"
            [(ngModel)]="eventsSelected"
            [settings]="eventsSettings"
            (onSelect)="record('select', $event)"
            (onDeSelect)="record('deselect', $event)"
            (onSelectAll)="record('selectAll', $event)"
            (onDeSelectAll)="record('deselectAll', $event)"
          ></angular-multiselect>
          <p class="settings-preview">skin: {{ eventsSettings.skin }}</p>
        </div>
    </div>

    <div class="code-cell">
      <div class="code-grid">
        <div class="code-card">
          <strong>HTML</strong>
          <pre>{{ htmlSnippet }}</pre>
        </div>
        <div class="code-card">
          <strong>TS</strong>
          <pre>{{ tsSnippet }}</pre>
        </div>
        <div class="code-card">
          <strong>Data</strong>
          <pre>{{ dataSnippet }}</pre>
        </div>
        <div class="code-card">
          <strong>SCSS</strong>
          <pre>{{ scssSnippet }}</pre>
        </div>
      </div>
    </div>
  </article>
</section>

<section class="activity">
  <h2>Event log</h2>
  <p *ngFor="let event of events">{{ event }}</p>
</section>
